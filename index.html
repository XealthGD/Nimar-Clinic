<!DOCTYPE html>
<html>
<body>
<h1>Audio Player💜</h1>
<h3> play anything you!</h3>
<input type="file" accept="audio/*" id="file">
<audio id="player" controls></audio>
<img src="https://media.tenor.com/BCQJFkjyNYwAAAAj/%D1%85%D0%B0%D0%BF%D0%BF%D0%B8-happy-cat.gif" width=200>
<style>
body {
	background-color: #7851A9;
	color: white;
}
h1 {
	color: #CF9FFF;
}
h3 {
	color: #CF9FFF;
}
button {
	background-color: #A020F0;
	color: #CF9FFF;
	border: none;
	padding: 10px;
}
input[type="file"] {
	color: #CF9FFF;
	border: none;
	padding: 10px;
}
audio {
	background: #A020F0;
	accent-color:  #A020F0;
}
</style>
<script>
let file = document.querySelector("#file")
let plr = document.querySelector("#player")
file.onchange = function() {
plr.src = URL.createObjectURL(file.files[0])
};
</script>
</body>
</html>
